<svg xmlns="http://www.w3.org/2000/svg" width="880" height="302" viewBox="0 0 880 302" role="img" aria-label="study.me.at at a glance: Locked stays on the server, Graded on the server, Review you can predict, Lapse keeps the record">
<rect x="0.5" y="0.5" width="879" height="301" rx="12" fill="#0a0a0a" stroke="#262626"/>
<rect x="24" y="24" width="196" height="254" rx="10" fill="#171717" stroke="#262626"/>
<text x="44" y="60" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" fill="#525252">01</text>
<line x1="72" y1="56" x2="200" y2="56" stroke="#404040" stroke-width="1"/>
<text x="44" y="98" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="17" fill="#fafafa" font-weight="600"><tspan x="44" dy="0">Locked stays on</tspan><tspan x="44" dy="22">the server</tspan></text>
<text x="44" y="148" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" fill="#a3a3a3"><tspan x="44" dy="0">Access is checked</tspan><tspan x="44" dy="21">before a lesson is</tspan><tspan x="44" dy="21">fetched, so a locked</tspan><tspan x="44" dy="21">lesson never leaves</tspan><tspan x="44" dy="21">the server.</tspan></text>
<rect x="236" y="24" width="196" height="254" rx="10" fill="#171717" stroke="#262626"/>
<text x="256" y="60" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" fill="#525252">02</text>
<line x1="284" y1="56" x2="412" y2="56" stroke="#404040" stroke-width="1"/>
<text x="256" y="98" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="17" fill="#fafafa" font-weight="600"><tspan x="256" dy="0">Graded on the</tspan><tspan x="256" dy="22">server</tspan></text>
<text x="256" y="148" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" fill="#a3a3a3"><tspan x="256" dy="0">Answers are graded</tspan><tspan x="256" dy="21">against a key the</tspan><tspan x="256" dy="21">browser never</tspan><tspan x="256" dy="21">receives, and a retry</tspan><tspan x="256" dy="21">gets the same grade.</tspan></text>
<rect x="448" y="24" width="196" height="254" rx="10" fill="#171717" stroke="#262626"/>
<text x="468" y="60" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" fill="#525252">03</text>
<line x1="496" y1="56" x2="624" y2="56" stroke="#404040" stroke-width="1"/>
<text x="468" y="98" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="17" fill="#fafafa" font-weight="600"><tspan x="468" dy="0">Review you can</tspan><tspan x="468" dy="22">predict</tspan></text>
<text x="468" y="148" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" fill="#a3a3a3"><tspan x="468" dy="0">Spaced review uses</tspan><tspan x="468" dy="21">ts-fsrs with fuzzing</tspan><tspan x="468" dy="21">off and an explicit</tspan><tspan x="468" dy="21">clock, so due dates</tspan><tspan x="468" dy="21">are reproducible.</tspan></text>
<rect x="660" y="24" width="196" height="254" rx="10" fill="#171717" stroke="#262626"/>
<text x="680" y="60" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" fill="#525252">04</text>
<line x1="708" y1="56" x2="836" y2="56" stroke="#404040" stroke-width="1"/>
<text x="680" y="98" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="17" fill="#fafafa" font-weight="600"><tspan x="680" dy="0">Lapse keeps the</tspan><tspan x="680" dy="22">record</tspan></text>
<text x="680" y="148" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" fill="#a3a3a3"><tspan x="680" dy="0">When a subscription</tspan><tspan x="680" dy="21">lapses, access goes,</tspan><tspan x="680" dy="21">but attempts,</tspan><tspan x="680" dy="21">completions and</tspan><tspan x="680" dy="21">certificates are</tspan><tspan x="680" dy="21">kept.</tspan></text>
</svg>
